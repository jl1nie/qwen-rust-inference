name: Offline Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare pinned toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --offline --locked --all-targets -- -D warnings
      - run: cargo test --offline --locked
      - name: Check optional ROCm Rust path without GPU dependencies
        run: cargo clippy --offline --locked --features rocm --all-targets -- -D warnings
      - name: CPU emulation of ROCm kernel arithmetic (not a GPU test)
        run: cargo test --offline --locked --features rocm
