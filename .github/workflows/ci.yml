name: Offline Rust checks
# PR branches are checked once, through pull_request; push only checks main
# after a merge (a push to a PR branch used to run everything twice).
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same PR cancels its older, still running checks. Runs
# on main are never cancelled, so every merge result gets checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# The Metal path is not checked here: a macOS runner counts 10x against the
# private repository's Actions minutes. Check it on a Mac before merging:
#   cargo clippy --offline --locked --features metal --all-targets -- -D warnings
#   cargo test --offline --locked --features metal
#   bash tools/build-metal.sh
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare pinned toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --offline --locked --all-targets -- -D warnings
      - run: cargo test --offline --locked
      - name: Check the optional training code (book 3, CPU)
        run: cargo clippy --offline --locked --features train --all-targets -- -D warnings
      - name: Training gradients against numerical differentiation
        run: cargo test --offline --locked --features train --test train_grad --test train_ffn --test train_fit --test train_lora --test train_distill --test train_delta --test train_lesson
      - name: Check optional ROCm Rust path without GPU dependencies
        run: cargo clippy --offline --locked --features rocm --all-targets -- -D warnings
      - name: CPU emulation of ROCm kernel arithmetic (not a GPU test)
        run: cargo test --offline --locked --features rocm
      - name: Check optional CUDA Rust path without GPU dependencies
        run: cargo clippy --offline --locked --features cuda --all-targets -- -D warnings
  cuda-build:
    # The CUDA bridge compiles the HIP source of native/rocm (ADR 0033), so
    # a change made for ROCm must still build for CUDA. Compile only: no GPU.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install the CUDA compiler and cuBLAS headers (no driver)
        run: |
          curl -fsSL -o /tmp/cuda-keyring.deb https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-13-3 cuda-cudart-dev-13-3 libcublas-dev-13-3
      - name: Build the CUDA bridge
        run: CUDA_PATH=/usr/local/cuda-13.3 CUDA_ARCH=sm_89 bash tools/build-cuda.sh
