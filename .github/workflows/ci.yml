name: Offline Rust checks
# PR branches are checked once, through pull_request; push only checks main
# after a merge (a push to a PR branch used to run everything twice).
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same PR cancels its older, still running checks. Runs
# on main are never cancelled, so every merge result gets checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare pinned toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --offline --locked --all-targets -- -D warnings
      - run: cargo test --offline --locked
      - name: Check optional ROCm Rust path without GPU dependencies
        run: cargo clippy --offline --locked --features rocm --all-targets -- -D warnings
      - name: CPU emulation of ROCm kernel arithmetic (not a GPU test)
        run: cargo test --offline --locked --features rocm
  metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare pinned toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy
      - name: Check optional Metal Rust path
        run: cargo clippy --offline --locked --features metal --all-targets -- -D warnings
      - name: CPU emulation of device kernel arithmetic (not a GPU test)
        run: cargo test --offline --locked --features metal
      - name: Build Metal bridge (GPU tests are opt-in; see spec/metal.md)
        run: bash tools/build-metal.sh
