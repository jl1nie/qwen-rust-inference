[package]
name = "qwen-rust-inference"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Inspectable CPU reference operations for learning Qwen inference"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
safetensors = "=0.5.3"
tokenizers = { version = "=0.21.0", default-features = false, features = ["onig"] }
matrixmultiply = "=0.3.9"
sha2 = "=0.10.9"
